name: Build Android APK

# Packages game/ (standalone VR Arena) into a debug APK via Capacitor.
# Download app-debug.apk from the run's Artifacts when it finishes.
# Unsigned debug build: install it with "unknown sources".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'mobile-apk/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS dependencies
        working-directory: mobile-apk
        run: npm install

      - name: Bundle the VR game into the web dir
        working-directory: mobile-apk
        run: node prepare-web.js

      - name: Generate the native Android project
        working-directory: mobile-apk
        run: npx cap add android

      - name: Camera permission and landscape
        working-directory: mobile-apk
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          perms = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.MODIFY_AUDIO_SETTINGS",
          ]
          for perm in perms:
              if perm not in text:
                  tag = f'<uses-permission android:name="{perm}" />'
                  text = text.replace("<application", tag + "\n    <application", 1)
          if "android.hardware.camera" not in text:
              feat = (
                  '<uses-feature android:name="android.hardware.camera" android:required="false" />\n'
                  '    <uses-feature android:name="android.hardware.camera.front" android:required="false" />\n'
                  "    <application"
              )
              text = text.replace("<application", feat, 1)
          old = 'android:launchMode="singleTask"'
          new = 'android:launchMode="singleTask" android:screenOrientation="sensorLandscape"'
          if old in text and "screenOrientation" not in text:
              text = text.replace(old, new, 1)
          p.write_text(text)

          matches = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if not matches:
              raise SystemExit("MainActivity.java not found")
          act = matches[0]
          pkg = act.read_text().split("package ", 1)[1].split(";", 1)[0].strip()
          act.write_text(
              "package " + pkg + ";\n\n"
              "import android.Manifest;\n"
              "import android.content.pm.PackageManager;\n"
              "import android.os.Bundle;\n"
              "import androidx.core.app.ActivityCompat;\n"
              "import androidx.core.content.ContextCompat;\n"
              "import com.getcapacitor.BridgeActivity;\n\n"
              "public class MainActivity extends BridgeActivity {\n"
              "  @Override\n"
              "  public void onCreate(Bundle savedInstanceState) {\n"
              "    super.onCreate(savedInstanceState);\n"
              "    if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)\n"
              "        != PackageManager.PERMISSION_GRANTED) {\n"
              "      ActivityCompat.requestPermissions(this,\n"
              "          new String[]{Manifest.permission.CAMERA}, 1001);\n"
              "    }\n"
              "  }\n"
              "}\n"
          )
          print("patched", act)
          PY

      - name: Sync Capacitor
        working-directory: mobile-apk
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: mobile-apk/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vr-arena-debug-apk
          path: mobile-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
