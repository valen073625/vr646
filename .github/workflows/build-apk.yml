name: Build Android APK

# Builds mobile-apk/ (the Capacitor wrapper around mobile-client/) into a
# debug .apk entirely on GitHub's servers — no Android Studio needed on your
# own machine. Download the result from the workflow run's "Artifacts"
# section once it finishes.
#
# This produces a DEBUG apk (unsigned, installable via "unknown sources",
# fine for personal use). A release/signed build needs a keystore, which
# shouldn't live in the repo — see the commented-out section at the bottom
# for how to add that with GitHub Secrets if you want a signed release build.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-apk/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS dependencies
        working-directory: mobile-apk
        run: npm install

      - name: Generate the native Android project
        working-directory: mobile-apk
        run: npx cap add android

      - name: Add camera + network permissions to the manifest
        working-directory: mobile-apk
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />#' "$MANIFEST"
          grep -A2 'permission.INTERNET' "$MANIFEST"

      - name: Sync Capacitor
        working-directory: mobile-apk
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: mobile-apk/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diy-vr-debug-apk
          path: mobile-apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

